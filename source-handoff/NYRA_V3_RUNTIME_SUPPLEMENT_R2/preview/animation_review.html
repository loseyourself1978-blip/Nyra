<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyra · 本地素材审片</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#15121d;color:#f3eefb}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1220px;margin:auto}h1{font-size:27px;margin:0 0 8px}p{line-height:1.6;color:#c4bcd2}header{border-bottom:1px solid #40344f;padding-bottom:18px}section{display:grid;grid-template-columns:minmax(280px,1fr) minmax(290px,1fr);gap:24px;margin-top:24px}.panel{background:#211c2b;border:1px solid #4d3d62;border-radius:16px;padding:20px}button,select,input{font:inherit}button,select{border:1px solid #7c639e;border-radius:10px;background:#30263f;color:#fff;padding:10px 13px;margin:5px 6px 5px 0}button:disabled{opacity:.4}label{display:block;margin:12px 0 7px}canvas{max-height:70vh;max-width:100%;display:block;margin:auto;width:auto;height:auto;background:transparent}.stage{min-height:320px;background-color:#a7a2b0;background-image:linear-gradient(45deg,#c8c4cf 25%,transparent 25%),linear-gradient(-45deg,#c8c4cf 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c8c4cf 75%),linear-gradient(-45deg,transparent 75%,#c8c4cf 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;border-radius:12px;overflow:hidden}.badge{display:inline-block;padding:6px 10px;border-radius:8px;background:#653d46;color:#ffe5e5}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:12px;color:#d4cbdc}small{color:#bfb3d0}input[type=file]{max-width:100%}@media(max-width:760px){body{padding:14px}section{grid-template-columns:1fr}canvas{max-height:55vh}}
</style><main><header><h1>夜璃 · Nyra｜本地素材审片</h1><p>载入补充包目录，检查真正生成的PNG。此页不联网、不生成图片、不调用模型、不安装Pets。缺图只显示缺图，不用海报冒充动画。</p><span id="status" class="badge">未加载 · 运行画稿未核验</span></header><section><div class="panel"><div class="stage" id="stage"><canvas id="c" width="512" height="768" aria-label="素材预览"></canvas></div><p id="caption">请选择含 specs 和 runtime 的补充包目录。</p></div><div class="panel"><label for="folder">选择整个补充包目录</label><input id="folder" type="file" webkitdirectory multiple><label for="sequence">动作 / 姿态</label><select id="sequence"></select><div><button id="play" disabled>播放</button><button id="stop" disabled>暂停</button><button id="prev" disabled>上一帧</button><button id="next" disabled>下一帧</button></div><label for="bg">检查背景</label><select id="bg"><option value="checker">棋盘格</option><option value="#ffffff">纯白</option><option value="#000000">纯黑</option><option value="#7b50a5">紫色</option></select><label><input type="checkbox" id="anchor" checked> 显示固定脚锚点（不是人物动作）</label><p id="detail">运行图未提供时不会出现虚构角色或自动演示。</p><pre id="summary"></pre><small>播放正常不自动授予PASS；需人工检查同脸、服装覆盖、手部、alpha边缘和连续性。关闭页面只结束审片。</small></div></section></main><script>
'use strict';
const $=id=>document.getElementById(id),ctx=$('c').getContext('2d');
let files=new Map(),catalog={},sequences={},images=new Map(),seq=null,idx=0,playing=false,last=0,elapsed=0,raf=0,rev=0;
function halt(){playing=false;cancelAnimationFrame(raf);raf=0}
function blank(text){ctx.clearRect(0,0,512,768);ctx.fillStyle='#2c203a';ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText(text,256,360)}
function draw(){ctx.clearRect(0,0,512,768);if(!seq){blank('尚无运行素材');return}const aid=seq.asset_ids[idx],im=images.get(aid);if(im)ctx.drawImage(im,0,0,512,768);else blank('MISSING: '+aid);if($('anchor').checked){ctx.strokeStyle='#ff5050';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(246,722);ctx.lineTo(266,722);ctx.moveTo(256,712);ctx.lineTo(256,732);ctx.stroke()}$('caption').textContent=`${$('sequence').value} · 槽 ${idx+1}/${seq.asset_ids.length} · ${aid}`;$('detail').textContent=im?`实际解码 ${im.naturalWidth}×${im.naturalHeight}。请审查局部身体运动与alpha轮廓，不是只观察整图位移。`:'此槽缺实际PNG；不允许以占位图作为已完成动作。'}
function tick(t){if(!playing)return;if(!last)last=t;elapsed+=t-last;last=t;const dur=seq.durations_ms?.[idx]||150;if(elapsed>=dur){elapsed=0;idx++;if(idx>=seq.asset_ids.length){if(seq.loop)idx=0;else{idx=0;halt()}}draw()}if(playing)raf=requestAnimationFrame(tick)}
function select(){halt();idx=0;seq=sequences[$('sequence').value]||null;const complete=seq&&seq.asset_ids.every(id=>images.has(id));$('play').disabled=!complete;['stop','prev','next'].forEach(x=>$(x).disabled=!seq);draw()}
$('folder').addEventListener('change',async e=>{halt();const my=++rev;files=new Map();images.clear();catalog={};sequences={};$('sequence').replaceChildren();for(const f of e.target.files){const bits=f.webkitRelativePath.split('/');bits.shift();files.set(bits.join('/'),f)}try{const cf=files.get('specs/assets_required.json'),sf=files.get('specs/standalone_p0.json');if(!cf||!sf)throw Error('请选择补充包根目录，而非单独runtime子目录');const ca=JSON.parse(await cf.text()),ss=JSON.parse(await sf.text());for(const a of ca.assets)catalog[a.id]=a;sequences=ss.sequences;const pf=files.get('specs/pets_layout_profiles.json');if(pf){const profiles=JSON.parse(await pf.text());for(const r of profiles.profiles.pets_v2_attachment_provisional.row_definitions)sequences['pets / '+r.state]={asset_ids:r.asset_ids,loop:!['waving','jumping'].includes(r.state),durations_ms:r.asset_ids.map(()=>150)}}let count=0;for(const a of ca.assets){const f=files.get(a.path);if(!f)continue;const url=URL.createObjectURL(f);try{const im=new Image();im.src=url;await im.decode();if(my!==rev)return;images.set(a.id,im);count++}catch{}finally{URL.revokeObjectURL(url)}}if(my!==rev)return;for(const name of Object.keys(sequences)){const op=document.createElement('option');op.value=name;op.textContent=name;$('sequence').appendChild(op)}$('status').textContent=`实际加载 ${count}/${ca.assets.length} 张 · 人工审片未完成`;$('summary').textContent=JSON.stringify({loaded_actual_png:count,expected_unique_png:ca.assets.length,art_generation:false,pets_install:false,visual_acceptance:'NOT_AUTOMATIC'},null,2);select()}catch(err){$('status').textContent='加载失败';$('summary').textContent=String(err);blank('加载失败，不产生替代图片')}});
$('sequence').onchange=select;$('play').onclick=()=>{if(!seq||!seq.asset_ids.every(x=>images.has(x)))return;playing=true;last=0;elapsed=0;raf=requestAnimationFrame(tick)};$('stop').onclick=halt;$('prev').onclick=()=>{halt();idx=(idx-1+seq.asset_ids.length)%seq.asset_ids.length;draw()};$('next').onclick=()=>{halt();idx=(idx+1)%seq.asset_ids.length;draw()};$('bg').onchange=()=>{const c=$('bg').value;$('stage').style.backgroundImage=c==='checker'?'':'none';$('stage').style.backgroundColor=c==='checker'?'#a7a2b0':c};$('anchor').onchange=draw;blank('尚无运行素材');
</script></html>
